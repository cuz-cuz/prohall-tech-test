services:
  db:
    image: postgres:18-alpine
    # Credenciais exclusivas do ambiente Docker local; não reutilizar no deploy.
    environment:
      POSTGRES_DB: mosaico
      POSTGRES_USER: mosaico
      POSTGRES_PASSWORD: mosaico_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mosaico -d mosaico"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build:
      context: ./backend
    command: >-
      sh -c "python manage.py migrate &&
      python manage.py bootstrap_demo &&
      python manage.py runserver 0.0.0.0:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: docker-development-only-key
      DATABASE_URL: postgresql://mosaico:mosaico_dev@db:5432/mosaico
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      DEMO_ADMIN_USERNAME: admin
      DEMO_ADMIN_EMAIL: admin@mosaico.local
      # Credencial pública de teste exigida pelo desafio (também no README).
      DEMO_ADMIN_PASSWORD: Admin@123
      DEMO_RESET_ENABLED: "True"
      DEMO_RESET_COOLDOWN_SECONDS: "10"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
